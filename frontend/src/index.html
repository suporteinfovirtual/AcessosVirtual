<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Painel Virtual Sistemas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0d">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="bg-zinc-950">
  <!-- Fundo animado. Fica fora do <app-root> de propósito: começa a carregar junto com o
       HTML, não reinicia ao trocar de rota (login -> painel) e não passa pelo change
       detection do Angular. Sem som, sem controles e fora da navegação por teclado.
       Se o arquivo faltar ou o navegador bloquear o autoplay, o elemento fica vazio e
       aparece a imagem de fundo do body, que continua sendo o padrão. -->
  <video
    id="fundo-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    disablepictureinpicture
    aria-hidden="true"
    tabindex="-1"
  >
    <!-- WebM/VP9 primeiro: o navegador usa o primeiro formato que reconhece, e o VP9
         segura degradê escuro muito melhor que H.264 no mesmo tamanho de arquivo.
         O MP4 fica para o Safari, que não toca VP9. -->
    <source src="fundo-painel.webm" type="video/webm" />
    <source src="fundo-painel.mp4" type="video/mp4" />
  </video>
  <app-root></app-root>
</body>
</html>
