<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/70 px-4 py-8 backdrop-blur-sm" (click)="fechar.emit()">
  <div
    class="w-full max-w-lg rounded-2xl border border-zinc-800 bg-zinc-900 shadow-2xl shadow-black/40"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-zinc-800 px-6 py-4">
      <h2 class="text-base font-semibold text-zinc-100">
        {{ editando ? 'Editar artigo' : 'Novo artigo' }}
      </h2>
      <button type="button" class="rounded p-1 text-zinc-500 hover:bg-zinc-800 hover:text-zinc-300" (click)="fechar.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <form class="max-h-[70vh] overflow-y-auto px-6 py-5" (ngSubmit)="salvarArtigo()">
      <div class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-zinc-300">Título*</label>
          <input
            [(ngModel)]="titulo"
            name="titulo"
            required
            placeholder="Ex: Erro ao gravar nota fiscal de entrada"
            class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-zinc-300">Código do erro</label>
          <input
            [(ngModel)]="codigo"
            name="codigo"
            placeholder="Ex: COMR492, 0x80090014…"
            class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-zinc-300">Mensagem do erro</label>
          <textarea
            [(ngModel)]="mensagemErro"
            name="mensagem_erro"
            rows="2"
            placeholder="Cole aqui o texto exato que aparece na tela"
            class="w-full resize-none rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 font-mono text-xs text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
          ></textarea>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-zinc-300">Causa</label>
          <textarea
            [(ngModel)]="causa"
            name="causa"
            rows="3"
            placeholder="Por que esse erro acontece"
            class="w-full resize-none rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
          ></textarea>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-zinc-300">Solução</label>
          <textarea
            [(ngModel)]="solucao"
            name="solucao"
            rows="3"
            placeholder="Como resolver, passo a passo"
            class="w-full resize-none rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
          ></textarea>
        </div>
      </div>

      @if (erro()) {
        <p class="mt-4 text-sm text-red-400">{{ erro() }}</p>
      }

      <div class="mt-6 flex items-center justify-between border-t border-zinc-800 pt-4">
        @if (editando) {
          <button
            type="button"
            [disabled]="excluindo()"
            class="text-sm font-medium text-red-400 hover:text-red-300 disabled:opacity-50"
            (click)="excluirArtigo()"
          >
            {{ excluindo() ? 'Excluindo…' : 'Excluir artigo' }}
          </button>
        } @else {
          <span></span>
        }

        <div class="flex gap-2">
          <button
            type="button"
            class="rounded-lg px-4 py-2 text-sm font-medium text-zinc-400 hover:bg-zinc-800"
            (click)="fechar.emit()"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="!titulo().trim() || salvando()"
            class="rounded-lg bg-accent px-4 py-2 text-sm font-medium text-zinc-950 hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ salvando() ? 'Salvando…' : 'Salvar' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
