<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/70 px-4 py-8 backdrop-blur-sm" (click)="fechar.emit()">
  <div
    class="w-full max-w-md rounded-2xl border border-zinc-800 bg-zinc-900 shadow-2xl shadow-black/40"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-zinc-800 px-6 py-4">
      <h2 class="text-base font-semibold text-zinc-100">Técnicos</h2>
      <button type="button" class="rounded p-1 text-zinc-500 hover:bg-zinc-800 hover:text-zinc-300" (click)="fechar.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="max-h-[70vh] overflow-y-auto px-6 py-5">
      @if (carregando()) {
        <p class="py-6 text-center text-sm text-zinc-600">Carregando…</p>
      } @else if (tecnicos().length === 0) {
        <p class="py-6 text-center text-sm text-zinc-600">Nenhum técnico cadastrado ainda.</p>
      } @else {
        <ul class="space-y-1.5">
          @for (tecnico of tecnicos(); track tecnico.id) {
            <li class="flex items-center gap-2 rounded-lg border border-zinc-800 bg-zinc-950/60 px-3 py-2">
              @if (idEmEdicao() === tecnico.id) {
                <input
                  [(ngModel)]="nomeEdicao"
                  name="nomeEdicao"
                  class="min-w-0 flex-1 rounded-md border border-zinc-700 bg-zinc-900 px-2 py-1 text-sm text-zinc-100 outline-none focus:border-accent"
                  (keyup.enter)="salvarEdicao()"
                  (keyup.escape)="cancelarEdicao()"
                />
                <button type="button" class="text-xs font-medium text-accent hover:text-accent-hover" [disabled]="salvandoEdicao()" (click)="salvarEdicao()">
                  Salvar
                </button>
                <button type="button" class="text-xs font-medium text-zinc-500 hover:text-zinc-300" (click)="cancelarEdicao()">
                  Cancelar
                </button>
              } @else {
                <span class="min-w-0 flex-1 truncate text-sm text-zinc-200">{{ tecnico.nome }}</span>
                <button type="button" class="text-xs font-medium text-zinc-500 hover:text-zinc-300" (click)="iniciarEdicao(tecnico)">
                  Renomear
                </button>
                <button type="button" class="text-xs font-medium text-red-400 hover:text-red-300" (click)="excluirTecnico(tecnico)">
                  Excluir
                </button>
              }
            </li>
          }
        </ul>
      }

      @if (erro()) {
        <p class="mt-3 text-sm text-red-400">{{ erro() }}</p>
      }

      <form class="mt-5 flex gap-2 border-t border-zinc-800 pt-4" (ngSubmit)="criarTecnico()">
        <input
          [(ngModel)]="nomeNovo"
          name="nomeNovo"
          placeholder="Novo técnico…"
          class="min-w-0 flex-1 rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
        />
        <button
          type="submit"
          [disabled]="!nomeNovo().trim() || criando()"
          class="rounded-lg bg-accent px-4 py-2 text-sm font-medium text-zinc-950 hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ criando() ? 'Criando…' : 'Adicionar' }}
        </button>
      </form>
    </div>
  </div>
</div>
