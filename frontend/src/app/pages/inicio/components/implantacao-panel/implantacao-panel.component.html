<div>
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h2 class="text-lg font-semibold text-zinc-100">Implantação</h2>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded-lg border border-zinc-800 px-3 py-2.5 text-sm font-medium text-zinc-400 hover:border-zinc-700 hover:text-zinc-200"
        (click)="abrirTecnicos()"
      >
        Técnicos
      </button>
      <button
        type="button"
        class="rounded-lg border border-zinc-800 px-4 py-2.5 text-sm font-medium text-zinc-950 bg-accent hover:bg-accent-hover"
        (click)="abrirNovo()"
      >
        Nova implantação
      </button>
    </div>
  </div>

  <div class="mt-5 flex items-center justify-between">
    <div class="flex items-center gap-1">
      <button
        type="button"
        class="rounded-lg p-2 text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200"
        (click)="mesAnterior()"
        title="Mês anterior"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
      </button>
      <h3 class="w-44 text-center text-sm font-medium text-zinc-200">{{ rotuloMes() }}</h3>
      <button
        type="button"
        class="rounded-lg p-2 text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200"
        (click)="proximoMes()"
        title="Próximo mês"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
      </button>
    </div>

    <button
      type="button"
      class="rounded-lg border border-zinc-800 px-3 py-1.5 text-xs font-medium text-zinc-400 hover:border-zinc-700 hover:text-zinc-200"
      (click)="irParaHoje()"
    >
      Hoje
    </button>
  </div>

  <div class="mt-4">
    @if (carregando()) {
      <app-skeleton variante="linhas"></app-skeleton>
    } @else {
      <div class="grid grid-cols-7 gap-px overflow-hidden rounded-lg border border-zinc-800 bg-zinc-800">
        @for (nomeDia of nomesDiaSemana; track nomeDia) {
          <div class="bg-zinc-900 px-2 py-2 text-center text-[11px] font-medium uppercase tracking-wide text-zinc-500">
            {{ nomeDia }}
          </div>
        }

        @for (dia of diasDaGrade(); track dia.dataIso) {
          <button
            type="button"
            class="flex min-h-24 flex-col gap-1 bg-zinc-950 p-1.5 text-left align-top transition hover:bg-zinc-900 sm:min-h-28"
            [class.opacity-40]="!dia.dentroDoMes"
            (click)="abrirNovo(dia.dataIso)"
          >
            <span
              class="flex h-5 w-5 items-center justify-center rounded-full text-xs"
              [class.bg-accent]="dia.hoje"
              [class.text-zinc-950]="dia.hoje"
              [class.font-semibold]="dia.hoje"
              [class.text-zinc-400]="!dia.hoje"
            >
              {{ dia.dia }}
            </span>

            <div class="flex flex-col gap-1">
              @for (item of implantacoesNoDia(dia.dataIso); track item.id) {
                <span
                  [class]="concluida(item)
                    ? 'truncate rounded bg-zinc-800 px-1.5 py-0.5 text-[11px] text-zinc-500 line-through hover:bg-zinc-700'
                    : 'truncate rounded bg-accent-soft px-1.5 py-0.5 text-[11px] text-accent hover:bg-accent/25'"
                  [title]="item.tecnico_nome ? item.hora + ' · ' + item.cliente_nome + ' · técnico: ' + item.tecnico_nome : item.hora + ' · ' + item.cliente_nome"
                  (click)="$event.stopPropagation(); abrirEdicao(item)"
                >
                  {{ item.hora }} · {{ item.cliente_nome }}{{ item.tecnico_nome ? ' · ' + item.tecnico_nome : '' }}
                </span>
              }
            </div>
          </button>
        }
      </div>
    }
  </div>
</div>

@if (modalAberto()) {
  <app-implantacao-modal
    [implantacao]="implantacaoEmEdicao()"
    [dataInicial]="dataParaNova()"
    (fechar)="fecharModal()"
    (salvo)="aoSalvar()"
  ></app-implantacao-modal>
}

@if (tecnicosModalAberto()) {
  <app-tecnicos-modal
    (fechar)="tecnicosModalAberto.set(false)"
    (alterado)="aoAlterarTecnicos()"
  ></app-tecnicos-modal>
}
