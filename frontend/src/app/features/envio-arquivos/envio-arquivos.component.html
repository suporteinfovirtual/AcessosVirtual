<app-card>
  <h3 class="text-sm font-semibold text-zinc-100">Enviar arquivos por e-mail</h3>

  <div
    class="relative mt-4 flex flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed px-4 py-6 text-center transition"
    [class.border-accent]="arrastando()"
    [class.bg-accent-soft]="arrastando()"
    [class.border-zinc-800]="!arrastando()"
    (dragover)="aoArrastarSobre($event)"
    (dragleave)="aoSairArraste($event)"
    (drop)="aoSoltarArquivos($event)"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6 text-zinc-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15m-6 0 3-3m0 0 3 3m-3-3v9.75"/></svg>
    <p class="text-sm text-zinc-400">
      Arraste os arquivos aqui ou
      <label for="envio-arquivos-input" class="cursor-pointer font-medium text-accent hover:text-accent-hover">selecione no computador</label>
    </p>
    <input id="envio-arquivos-input" type="file" multiple class="hidden" (change)="aoSelecionarArquivos($event)" />
  </div>

  @if (arquivos().length > 0) {
    <ul class="mt-3 flex flex-col gap-1.5">
      @for (arquivo of arquivos(); track arquivo.name + arquivo.size + $index; let i = $index) {
        <li class="flex items-center justify-between gap-2 rounded-lg border border-zinc-800 bg-zinc-900/60 px-3 py-2">
          <span class="min-w-0 flex-1 truncate text-sm text-zinc-200">{{ arquivo.name }}</span>
          <span class="shrink-0 text-xs text-zinc-500">{{ formatarTamanho(arquivo.size) }}</span>
          <button
            type="button"
            class="shrink-0 rounded p-1 text-zinc-500 hover:bg-zinc-800 hover:text-red-400"
            (click)="removerArquivo(i)"
            title="Remover"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </li>
      }
    </ul>
  }

  <div class="mt-4">
    <label class="mb-1 block text-[11px] uppercase tracking-wide text-zinc-500">E-mail do destinatário</label>
    <input
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      type="email"
      placeholder="email@contabilidade.com.br"
      class="w-full rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none focus:border-accent focus:ring-2 focus:ring-accent-soft"
    />
  </div>

  <button
    type="button"
    class="mt-4 flex w-full items-center justify-center gap-1.5 rounded-lg bg-gradient-to-br from-accent to-accent-hover px-4 py-2.5 text-sm font-medium text-zinc-950 transition-colors hover:from-accent-hover hover:to-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!podeEnviar()"
    (click)="enviarEmail()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/></svg>
    Enviar email
  </button>
</app-card>
